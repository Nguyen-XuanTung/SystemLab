name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Python demo runner safety tests
        run: python3 -m unittest discover -s tests/runner -v

      - name: Unit, analytical, and integration tests with coverage
        run: npm run test:coverage

      - name: Production build (root relative)
        run: npm run build

      - name: Production build (GitHub Pages subpath check)
        env:
          VITE_BASE_PATH: /SystemLab/
        run: npm run build

      - name: Verify GitHub Pages subpath assets and zero localhost leaks
        run: |
          test -f dist/index.html
          grep -q "/SystemLab/assets/" dist/index.html
          ls dist/assets/simulation.worker-*.js
          ! grep -rn "localhost:5200" dist/

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Run Playwright E2E suite
        run: npm run test:e2e
